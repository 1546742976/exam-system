<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/>
<title>监考控制台</title>
<style>
:root{--bg:#0f1420;--card:#182031;--line:#26314a;--fg:#e6edf6;--dim:#8b9bb4;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
header{display:flex;gap:16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}main{padding:20px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--dim)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500}.pill{padding:1px 8px;border-radius:20px;font-size:12px}
.on{background:rgba(63,185,80,.15);color:var(--ok)}.off{background:rgba(139,155,180,.15);color:var(--dim)}
.bad{background:rgba(248,81,73,.15);color:var(--err)}.warn{background:rgba(210,153,34,.15);color:var(--warn)}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#111a29;color:var(--fg)}
button{cursor:pointer;background:#1f6feb;border-color:#1f6feb}#login{max-width:360px;margin:80px auto;text-align:center}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.muted{color:var(--dim)}a{color:#79b8ff}.linkbtn{background:none;border:0;color:#79b8ff;padding:0;cursor:pointer;font:inherit}
</style></head><body>
<div id="login"><h1 style="font-size:18px">监考控制台</h1><p class="muted">需要管理员口令</p>
<input id="pwd" type="password" placeholder="管理员口令" style="width:100%"/><p><button onclick="doLogin()">登录</button></p>
<p id="err" class="bad"></p></div>
<div id="app" style="display:none"><header><h1>监考控制台</h1><span class="muted" id="stat"></span>
<span style="flex:1"></span><button onclick="load()">刷新</button></header>
<main>
<div class="grid">
<div class="card"><h2>学生列表</h2><table><thead><tr><th>账号</th><th>IP</th><th>状态</th><th>心跳</th><th>指纹</th><th>告警</th><th>上传</th><th>操作</th></tr></thead><tbody id="students"></tbody></table></div>
<div class="card"><h2>串通线索（同 IP 多账号）</h2><table><thead><tr><th>IP</th><th>情况</th></tr></thead><tbody id="sameip"></tbody></table>
<h2 style="margin-top:14px">告警统计</h2><table><thead><tr><th>类型</th><th>次数</th></tr></thead><tbody id="summary"></tbody></table></div>
</div>
<div class="card"><h2>最新告警</h2><table><thead><tr><th>时间</th><th>账号</th><th>IP</th><th>ID</th><th>描述</th></tr></thead><tbody id="alerts"></tbody></table></div>
<div class="card"><h2>事件</h2><table><thead><tr><th>时间</th><th>事件</th><th>账号</th><th>IP</th></tr></thead><tbody id="events"></tbody></table></div>
</main></div>
<script>
function ts(v){if(!v)return"-";return new Date(v*1000).toLocaleTimeString("zh-CN",{hour12:false})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function doLogin(){const p=document.getElementById("pwd").value;
 const r=await fetch("/exam/admin/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"password="+encodeURIComponent(p)});
 if(r.ok){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";load();setInterval(load,3000)}
 else{document.getElementById("err").textContent="口令错误"}}
async function load(){let d;try{const r=await fetch("/exam/admin/api/overview");if(!r.ok){location.reload();return}d=await r.json()}catch(e){return}
 const up={};(d.uploads||[]).forEach(u=>up[u.uname]=u);
 document.getElementById("stat").textContent="在线 "+d.online+" / 共 "+d.total+"　静默 "+(d.silent_students||[]).length+"　"+new Date().toLocaleTimeString("zh-CN",{hour12:false});
 document.getElementById("students").innerHTML=(d.students||[]).map(s=>{
  const u=up[s.uname];const upTxt=u?(u.n+" 片"+(u.gaps>0?" <span class='pill bad'>缺"+u.gaps+"</span>":"")):"<span class='pill off'>无</span>";
  let hb=s.online?"<span class='pill on'>正常</span>":(s.silent>=0?"<span class='pill bad'>静默 "+s.silent+"s</span>":"<span class='pill off'>离线</span>");
  if(s.hb_gaps>0)hb+=" <span class='pill bad'>缺"+s.hb_gaps+"</span>";
  const fp=s.fp_ok===1?"<span class='pill on'>通过</span>":(s.fp_ok===0?"<span class='pill bad'>不匹配</span>":"<span class='pill off'>未报</span>");
  return "<tr><td>"+esc(s.uname)+"</td><td>"+esc(s.ip)+"</td><td>"+(s.online?"<span class='pill on'>在线</span>":"<span class='pill off'>离线</span>")+"</td><td>"+hb+"</td><td>"+fp+"</td><td>"+(s.alert_count||0)+"</td><td>"+upTxt+"</td><td><button type='button' class='linkbtn' data-action='shot' data-ip='"+esc(s.ip)+"'>截图</button> · <button type='button' class='linkbtn' data-action='chal' data-ip='"+esc(s.ip)+"'>抽查</button></td></tr>"}).join("")||"<tr><td colspan=8 class='muted'>暂无学生</td></tr>";
 document.getElementById("sameip").innerHTML=(d.same_ip||[]).map(x=>"<tr><td>"+esc(x.ip)+"</td><td><span class='pill bad'>"+x.n+" 个账号</span> "+esc(x.users)+"</td></tr>").join("")||"<tr><td colspan=2 class='muted'>未发现</td></tr>";
 document.getElementById("summary").innerHTML=(d.alert_summary||[]).map(x=>"<tr><td>"+esc(x.kind)+"</td><td>"+x.n+"</td></tr>").join("")||"<tr><td colspan=2 class='muted'>暂无</td></tr>";
 document.getElementById("alerts").innerHTML=(d.alerts||[]).map(a=>"<tr><td>"+ts(a.ts)+"</td><td>"+esc(a.uname)+"</td><td>"+esc(a.ip)+"</td><td>"+esc(a.alert_id)+"</td><td>"+esc(a.text)+"</td></tr>").join("")||"<tr><td colspan=5 class='muted'>暂无</td></tr>";
 document.getElementById("events").innerHTML=(d.events||[]).map(e=>"<tr><td>"+ts(e.ts)+"</td><td>"+esc(e.kind)+"</td><td>"+esc(e.uname)+"</td><td>"+esc(e.ip)+"</td></tr>").join("")||"<tr><td colspan=4 class='muted'>暂无</td></tr>"}
document.getElementById("students").addEventListener("click",function(e){const b=e.target.closest("button[data-action]");if(!b)return;e.preventDefault();const ip=b.dataset.ip||"";if(b.dataset.action==="shot")shot(ip);else if(b.dataset.action==="chal")chal(ip)});
function shot(ip){const w=window.open("","_blank");if(!w)return;w.document.write("<title>"+esc(ip)+"</title><body style='background:#111;margin:0'><img src='/exam/admin/api/shot?ip="+encodeURIComponent(ip)+"&t="+Date.now()+"' style='max-width:100%'></body>");w.document.close()}
function chal(ip){const w=window.open("","_blank");if(!w)return;w.document.write("<title>抽查 "+esc(ip)+"</title><body style='background:#111;margin:0;color:#8f8;font-family:sans-serif'><p>画面上的随机码应与服务器下发一致；不变或缺失说明客户端被改过。</p><img src='/exam/admin/api/challenge?ip="+encodeURIComponent(ip)+"&t="+Date.now()+"' style='max-width:100%'></body>");w.document.close()}
</script></body></html>
